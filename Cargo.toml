[package]
name = "mcp_poison"
version = "0.1.0"
edition = "2021"
description = "Protocol-native MCP tool-surface auditor (full-schema poison, pin/rugpull)"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "security", "tool-poisoning", "llm", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
hex = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mcp-poison"
path = "src/main.rs"

[lib]
name = "mcp_poison"
path = "src/lib.rs"
